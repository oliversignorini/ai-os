<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agentic OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    };
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans h-screen overflow-hidden">
  <div class="grid h-screen" style="grid-template-rows: auto 1fr auto; grid-template-columns: 280px 1fr 320px;">
    <!-- Top bar -->
    <header id="topbar" class="col-span-3 border-b border-zinc-800 px-4 py-2 flex items-center justify-between text-sm">
      <div id="project-name" class="font-mono text-zinc-300">agentic-os</div>
      <div class="flex items-center gap-3">
        <div id="usage" class="text-zinc-400">Usage: —</div>
        <button id="refresh-btn" class="rounded border border-zinc-700 px-2 py-1 hover:bg-zinc-900">Refresh</button>
      </div>
    </header>

    <!-- Left pane: Skills -->
    <aside id="skills-pane" class="border-r border-zinc-800 overflow-y-auto p-3">
      <div class="text-xs uppercase tracking-wider text-zinc-500 mb-2">Skills</div>
      <input id="skill-search" type="search" placeholder="Search skills..."
             class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-sm mb-3" />
      <div id="skill-list"><!-- populated in Task 4 --></div>
    </aside>

    <!-- Center pane: Run -->
    <main id="run-pane" class="overflow-y-auto p-4">
      <div id="run-empty" class="text-zinc-500 text-sm">Pick a skill to begin.</div>
      <div id="run-active" class="hidden space-y-4">
        <div>
          <div class="flex items-baseline justify-between">
            <h2 id="run-skill-name" class="text-lg font-mono"></h2>
            <span id="run-skill-source" class="text-[10px] uppercase tracking-wider text-zinc-500"></span>
          </div>
          <p id="run-skill-description" class="text-sm text-zinc-400"></p>
        </div>
        <textarea id="run-prompt" rows="3"
                  class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 font-mono text-sm"></textarea>
        <div class="flex gap-2">
          <button id="run-submit" class="rounded bg-emerald-700 hover:bg-emerald-600 px-3 py-1 text-sm">Run</button>
          <button id="run-stop" class="hidden rounded bg-rose-700 hover:bg-rose-600 px-3 py-1 text-sm">Stop</button>
        </div>
        <div id="run-transcript" class="font-mono text-sm border border-zinc-800 rounded p-3 whitespace-pre-wrap min-h-[100px] bg-black/40"></div>
      </div>
    </main>

    <!-- Right pane: History -->
    <aside id="history-pane" class="border-l border-zinc-800 overflow-y-auto p-3">
      <div class="text-xs uppercase tracking-wider text-zinc-500 mb-2">Run history</div>
      <div id="history-list"><!-- populated in Task 11 --></div>
    </aside>

    <!-- Bottom bar -->
    <footer id="vault-changes-bar" class="col-span-3 border-t border-zinc-800 px-4 py-2 text-xs text-zinc-400 font-mono overflow-x-auto whitespace-nowrap">
      Recent vault changes: —
    </footer>
  </div>

  <script type="module">
    const $ = (sel) => document.querySelector(sel);

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url} → ${r.status}`);
      return r.json();
    }

    async function loadProjectName() {
      // For now, derive from URL or use static placeholder; real server will set it.
      $('#project-name').textContent = 'agentic-os';
    }

    async function loadUsage() {
      try {
        const usage = await fetchJson('/api/usage');
        if (!usage) { $('#usage').textContent = ''; return; }
        $('#usage').textContent = `Usage: 5h ${usage.fiveHourPercentUsed}% · 7d ${usage.weeklyPercentUsed}%`;
      } catch {
        $('#usage').textContent = ''; // graceful skip
      }
    }

    async function loadVaultChanges() {
      try {
        const changes = await fetchJson('/api/vault-changes');
        if (!changes.length) {
          $('#vault-changes-bar').textContent = 'Recent vault changes: (none)';
          return;
        }
        const text = changes
          .map(c => `${c.status} ${c.path}`)
          .join('  ·  ');
        $('#vault-changes-bar').textContent = `Recent vault changes:  ${text}`;
      } catch {
        $('#vault-changes-bar').textContent = ''; // hide on error
      }
    }

    async function bootBars() {
      await Promise.all([loadProjectName(), loadUsage(), loadVaultChanges()]);
    }

    function relativeTime(iso) {
      if (!iso) return 'never';
      const ms = Date.now() - new Date(iso).getTime();
      if (ms < 0) return 'just now'; // clock skew or future-stub data
      const s = Math.floor(ms / 1000);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      if (s < 86400) return `${Math.floor(s/3600)}h ago`;
      return `${Math.floor(s/86400)}d ago`;
    }

    function renderSkillCard(skill) {
      return `
        <button class="skill-card w-full text-left rounded p-2 hover:bg-zinc-900 border border-transparent hover:border-zinc-800"
                data-skill-id="${skill.id}">
          <div class="font-mono text-sm text-zinc-200">${skill.name}</div>
          <div class="text-xs text-zinc-500 line-clamp-2">${skill.description}</div>
          <div class="text-[10px] text-zinc-600 mt-1">last run ${relativeTime(skill.lastRunAt)}</div>
        </button>
      `;
    }

    function renderDomainGroup(domain, skills) {
      const id = `domain-${domain}`;
      return `
        <details class="mb-3" open>
          <summary class="text-xs uppercase tracking-wider text-zinc-500 cursor-pointer mb-1">${domain} (${skills.length})</summary>
          <div class="space-y-1" id="${id}">
            ${skills.sort((a,b) => a.name.localeCompare(b.name)).map(renderSkillCard).join('')}
          </div>
        </details>
      `;
    }

    let allSkills = []; // module-scoped cache for filter

    async function loadSkills() {
      allSkills = await fetchJson('/api/skills');
      renderSkills(allSkills);
    }

    function renderSkills(skills) {
      const byDomain = {};
      for (const s of skills) {
        (byDomain[s.domain] ||= []).push(s);
      }
      $('#skill-list').innerHTML = Object.keys(byDomain).sort()
        .map(d => renderDomainGroup(d, byDomain[d]))
        .join('');
    }

    $('#refresh-btn').addEventListener('click', async () => {
      bootBars();
      await loadSkills(); // history depends on allSkills cache
      loadHistory();
    });

    function openRunPane(skill) {
      $('#run-empty').classList.add('hidden');
      $('#run-active').classList.remove('hidden');
      $('#run-skill-name').textContent = skill.name;
      $('#run-skill-source').textContent = skill.source;
      $('#run-skill-description').textContent = skill.description;
      $('#run-prompt').value = `/${skill.name} `;
      $('#run-prompt').readOnly = false;
      $('#run-transcript').textContent = '';
      $('#run-submit').classList.remove('hidden');
      $('#run-stop').classList.add('hidden');
      $('#run-prompt').focus();
    }

    document.addEventListener('click', (e) => {
      const card = e.target.closest('.skill-card');
      if (!card) return;
      const skill = allSkills.find(s => s.id === card.dataset.skillId);
      if (skill) openRunPane(skill);
    });

    let currentRunId = null;
    let currentEventSource = null;

    async function startRun() {
      const prompt = $('#run-prompt').value.trim();
      const skillName = $('#run-skill-name').textContent;
      const skill = allSkills.find(s => s.name === skillName);
      if (!skill || !prompt) return;

      $('#run-submit').classList.add('hidden');
      $('#run-stop').classList.remove('hidden');
      $('#run-transcript').textContent = ''; // clear

      const r = await fetch('/api/run', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ skillId: skill.id, prompt }),
      });
      const { runId } = await r.json();
      currentRunId = runId;
      attachStream(runId);
    }

    function attachStream(runId) {
      if (currentEventSource) currentEventSource.close();
      const transcript = $('#run-transcript');
      transcript.textContent = '';

      currentEventSource = new EventSource(`/api/runs/${runId}/stream`);

      currentEventSource.onmessage = (e) => {
        let event;
        try { event = JSON.parse(e.data); } catch { return; }
        renderEvent(event, transcript);
      };

      currentEventSource.onerror = () => {
        // SSE close from server fires onerror in some browsers — close gracefully
        currentEventSource.close();
        onRunComplete();
      };
    }

    function onRunComplete() {
      $('#run-submit').classList.remove('hidden');
      $('#run-stop').classList.add('hidden');
      loadHistory(); // added in Task 11; safe no-op until then
    }

    const pendingTools = new Map(); // tool_use_id → DOM details element

    function renderEvent(event, container) {
      if (event.type === 'system') {
        appendBlock(container, `--- ${event.subtype || 'system'} ---\n`, 'text-zinc-500');
        return;
      }
      if (event.type === 'result') {
        appendBlock(container, `\n--- ${event.subtype || 'result'} (exit ${event.exit_code}) ---\n`, 'text-zinc-500');
        onRunComplete();
        return;
      }
      if (event.type === 'assistant' && event.message?.content) {
        for (const block of event.message.content) {
          if (block.type === 'text') {
            appendBlock(container, block.text, 'text-zinc-100');
          } else if (block.type === 'tool_use') {
            const det = document.createElement('details');
            det.className = 'my-1 ml-2 border-l-2 border-zinc-800 pl-2';
            const summary = document.createElement('summary');
            summary.className = 'text-amber-400 cursor-pointer text-xs';
            summary.textContent = `▸ ${block.name}(${summarizeInput(block.input)})`;
            det.appendChild(summary);
            const inputBlock = document.createElement('pre');
            inputBlock.className = 'text-xs text-zinc-500 mt-1';
            inputBlock.textContent = JSON.stringify(block.input, null, 2);
            det.appendChild(inputBlock);
            const resultPlaceholder = document.createElement('pre');
            resultPlaceholder.className = 'text-xs text-zinc-400 mt-1 hidden';
            det.appendChild(resultPlaceholder);
            pendingTools.set(block.id, resultPlaceholder);
            container.appendChild(det);
          }
        }
        container.scrollTop = container.scrollHeight;
        return;
      }
      if (event.type === 'user' && event.message?.content) {
        for (const block of event.message.content) {
          if (block.type === 'tool_result') {
            const target = pendingTools.get(block.tool_use_id);
            if (target) {
              const text = typeof block.content === 'string' ? block.content : JSON.stringify(block.content);
              target.textContent = text.length > 400 ? text.slice(0, 400) + '\n... (truncated)' : text;
              target.classList.remove('hidden');
              pendingTools.delete(block.tool_use_id);
            }
          }
        }
        container.scrollTop = container.scrollHeight;
        return;
      }
      appendBlock(container, `[unknown event: ${event.type}]\n`, 'text-zinc-600');
    }

    function summarizeInput(input) {
      if (!input || typeof input !== 'object') return '';
      // Show one notable key for brevity, e.g. file_path / command / pattern
      for (const k of ['file_path', 'command', 'pattern', 'url']) {
        if (input[k]) {
          const v = String(input[k]);
          return `${k}: ${v.length > 40 ? v.slice(0, 40) + '...' : v}`;
        }
      }
      const k = Object.keys(input)[0];
      return k ? `${k}: ...` : '';
    }

    function appendBlock(container, text, klass = '') {
      const span = document.createElement('span');
      if (klass) span.className = klass;
      span.textContent = text;
      container.appendChild(span);
      container.scrollTop = container.scrollHeight;
    }

    function statusIcon(status, exitCode) {
      if (status === 'cancelled') return '⊘';
      if (exitCode === 0) return '✓';
      if (exitCode != null) return '✗';
      return '⟳';
    }

    function statusColor(status, exitCode) {
      if (status === 'cancelled') return 'text-zinc-500';
      if (exitCode === 0) return 'text-emerald-400';
      if (exitCode != null) return 'text-rose-400';
      return 'text-amber-400';
    }

    function renderHistoryItem(run) {
      const skillName = (allSkills.find(s => s.id === run.skillId) || { name: run.skillId }).name;
      return `
        <button class="history-item w-full text-left rounded p-2 hover:bg-zinc-900 text-xs"
                data-run-id="${run.runId}">
          <div class="flex items-center gap-2">
            <span class="${statusColor(run.status, run.exitCode)}">${statusIcon(run.status, run.exitCode)}</span>
            <span class="font-mono text-zinc-200 truncate">${skillName}</span>
          </div>
          <div class="text-[10px] text-zinc-500 ml-5">${relativeTime(run.startedAt)}</div>
        </button>
      `;
    }

    async function loadHistory() {
      try {
        const runs = await fetchJson('/api/runs?limit=50');
        $('#history-list').innerHTML = runs.map(renderHistoryItem).join('');
      } catch {
        $('#history-list').innerHTML = '<div class="text-xs text-zinc-500">No history</div>';
      }
    }

    $('#run-submit').addEventListener('click', startRun);

    $('#run-stop').addEventListener('click', async () => {
      if (!currentRunId) return;
      try {
        await fetch(`/api/runs/${currentRunId}/cancel`, { method: 'POST' });
      } catch {}
      if (currentEventSource) currentEventSource.close();
      appendBlock($('#run-transcript'), '\n--- cancelled ---\n', 'text-rose-400');
      onRunComplete();
    });

    $('#skill-search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { renderSkills(allSkills); return; }
      const filtered = allSkills.filter(s =>
        s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q)
      );
      renderSkills(filtered);
    });

    (async () => {
      bootBars();
      await loadSkills(); // history depends on allSkills cache
      loadHistory();
    })();
  </script>
</body>
</html>
